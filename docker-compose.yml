services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ourglass
      POSTGRES_PASSWORD: ourglass
      POSTGRES_DB: ourglass_dev
    ports:
      - "5432:5432"
    volumes:
      - ourglass-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ourglass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ourglass-postgres-data:
