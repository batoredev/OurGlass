name: Deploy

# Track P1 task 6 of docs/REMAINING-EXECUTION-PLAN.md, re-pointed at the
# Supabase + Cloudflare Pages hosting (docs/DEPLOYMENT-DESIGN.md).
#
# WHAT THIS DEPLOYS: the two Supabase Edge Functions (`api`, `reminders`). The
# static site is NOT deployed here — Cloudflare Pages builds it from the
# repository on its own (Git integration), with NEXT_PUBLIC_API_URL set in the
# Pages project.
#
# PUSHES TO main DEPLOY STAGING. PRODUCTION IS MANUAL, on purpose: the runbook's
# order is deploy staging -> smoke check -> deploy production, and a smoke check
# is a human reading a reply from the assistant. Automating the production step
# would be automating away the gate.
#
# MIGRATIONS ARE NOT RUN HERE. `packages/db/migrations/**` is forward-only and
# applied by an operator against the target database's DIRECT connection
# (docs/RUNBOOK.md). A workflow holding a database URL that can ALTER TABLE is a
# blast radius this project does not need for a one-command step.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Which Supabase project to deploy the functions to
        type: choice
        default: staging
        options: [staging, production]

permissions: {}

concurrency:
  # NEVER cancel a deploy in flight: a half-deployed pair of functions is worse
  # than a queued deploy. (CI cancels superseded runs; this must not.)
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + deploy Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Which project: a repository VARIABLE (a project ref is not a secret),
      # the access token a SECRET.
      - id: target
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && vars.SUPABASE_PROJECT_REF || vars.SUPABASE_STAGING_PROJECT_REF }}
        run: |
          # SKIP, NOT FAIL, when the owner has not added the credentials yet.
          # A red main branch for a missing account setting would train
          # everyone to ignore red.
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$REF" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set the SUPABASE_ACCESS_TOKEN secret and the SUPABASE_STAGING_PROJECT_REF / SUPABASE_PROJECT_REF variables to enable deploys."
          fi

      # The same gates CI runs. A deploy that ships code failing its own tests
      # would make the pipeline a liability rather than a safety net.
      - if: steps.target.outputs.ready == 'true'
        run: pnpm typecheck
      - if: steps.target.outputs.ready == 'true'
        run: pnpm lint
      - if: steps.target.outputs.ready == 'true'
        run: pnpm test

      - if: steps.target.outputs.ready == 'true'
        run: pnpm run build:edge

      - if: steps.target.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      - name: Deploy functions
        if: steps.target.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ steps.target.outputs.ref }}
        run: |
          supabase functions deploy api --project-ref "$REF" --use-api
          supabase functions deploy reminders --project-ref "$REF" --use-api

      # Optional, and honest when absent: with the API's base URL in the
      # STAGING_URL / PRODUCTION_URL repository variables
      # (https://<ref>.supabase.co/functions/v1), the workflow proves the thing
      # it just deployed answers. /api/health needs no token.
      - name: Smoke check
        if: steps.target.outputs.ready == 'true'
        env:
          URL: ${{ (github.event_name == 'workflow_dispatch' && inputs.environment == 'production') && vars.PRODUCTION_URL || vars.STAGING_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice title=Smoke check skipped::Set the STAGING_URL (and PRODUCTION_URL) repository variables to smoke-check deploys."
            exit 0
          fi
          # tools/health_check.py, not a loop written here: the same probe is run
          # by the uptime workflow, and one behaviour belongs in one place.
          python tools/health_check.py --url "$URL" --label "deploy target"
