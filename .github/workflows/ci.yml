name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # No `version:` input here — pnpm/action-setup reads the version from
      # package.json's "packageManager" field. Setting both throws
      # "Multiple versions of pnpm specified" (found running this in CI).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  integration:
    name: integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ourglass
          POSTGRES_PASSWORD: ourglass
          POSTGRES_DB: ourglass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ourglass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ourglass:ourglass@localhost:5432/ourglass_test
    steps:
      - uses: actions/checkout@v7
      # No `version:` input here — pnpm/action-setup reads the version from
      # package.json's "packageManager" field. Setting both throws
      # "Multiple versions of pnpm specified" (found running this in CI).
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # apps/api imports @ourglass/db, which resolves through its built dist/ (its
      # package.json "main" points there) — not through source. Without this,
      # apps/api's integration tests fail with "Failed to resolve entry for package
      # @ourglass/db" (found by CI's own first run). Same class of bug as the build
      # job's build:libs fix, one job over: each CI job builds its own workspace,
      # nothing carries over between them.
      - run: pnpm run build:libs
      - run: pnpm db:migrate
      # Runs every package's test:integration script (currently packages/db's
      # merge-resolution suite and apps/api's tool-registry suite). Stays
      # correct as more packages add an integration lane.
      - run: pnpm -r --if-present run test:integration
