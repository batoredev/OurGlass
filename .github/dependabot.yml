version: 2
updates:
  # package-ecosystem is "npm" even for a pnpm project — verified in
  # docs/DECISIONS.md; "pnpm" is not a valid value.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      prod-minor-patch:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      # Deliberately pinned below latest — see docs/DECISIONS.md for why.
      # Major-version bumps only are ignored so patch/minor security fixes
      # on the pinned line still land.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
